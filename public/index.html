<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Dog</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🐕</span>
        <div>
          <h1>Big Dog</h1>
          <p id="tagline">What's up, Big Dog!?</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="brain-pill" class="pill">brain: …</span>
        <button id="logout-btn" class="btn ghost" style="display:none" onclick="logout()">Log out</button>
        <button class="btn" onclick="openCompose()">✏️ Compose</button>
        <button id="sync-btn" class="btn primary">Sync &amp; work the inbox</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="inbox">Inbox <span id="inbox-count" class="badge"></span></button>
      <button class="tab" data-tab="pipeline">Pipeline <span id="pipeline-count" class="badge"></span></button>
      <button class="tab" data-tab="calendar">Calendar <span id="cal-count" class="badge"></span></button>
      <button class="tab" data-tab="prospect">Prospect</button>
      <button class="tab" data-tab="drafts">Drafts <span id="drafts-count" class="badge"></span></button>
      <button class="tab" data-tab="sent">Sent</button>
      <button class="tab" data-tab="contacts">Contacts</button>
      <button class="tab" data-tab="campaigns">Campaigns</button>
      <button class="tab" data-tab="digest">Morning brief</button>
      <button class="tab" data-tab="chat">Ask Big Dog</button>
      <button class="tab" data-tab="activity">Activity</button>
      <button class="tab" data-tab="settings">⚙ Settings</button>
    </nav>

    <main id="main">
      <section id="inbox" class="panel active"></section>
      <section id="pipeline" class="panel"></section>
      <section id="calendar" class="panel"></section>
      <section id="prospect" class="panel"></section>
      <section id="drafts" class="panel"></section>
      <section id="sent" class="panel"></section>
      <section id="contacts" class="panel"></section>
      <section id="campaigns" class="panel"></section>
      <section id="digest" class="panel"></section>
      <section id="chat" class="panel"></section>
      <section id="activity" class="panel"></section>
      <section id="settings" class="panel"></section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="login" class="login-overlay" style="display:none">
      <div class="login-box">
        <div class="logo" style="font-size:46px">🐕</div>
        <h2 id="login-title">What's up, Big Dog!?</h2>
        <p class="muted small" id="login-sub">Enter your password to continue.</p>
        <input id="login-pw" type="password" placeholder="Password" />
        <button class="btn primary" onclick="doLogin()">Log in</button>
        <div id="login-err" class="muted small" style="color:var(--hot);margin-top:8px"></div>
      </div>
    </div>

    <div id="compose" class="login-overlay" style="display:none">
      <div class="login-box" style="max-width:640px;width:92%;text-align:left">
        <div class="row" style="align-items:center">
          <h2 id="compose-title" style="margin:0">✏️ New email</h2>
          <button class="btn ghost" onclick="closeCompose()">✕</button>
        </div>
        <input id="cmp-to" class="subj" list="contacts-dl" placeholder="To (comma-separate for multiple)" style="width:100%;margin-top:10px" />
        <input id="cmp-cc" class="subj" list="contacts-dl" placeholder="Cc (optional, comma-separated)" style="width:100%" />
        <datalist id="contacts-dl"></datalist>
        <input id="cmp-subject" class="subj" placeholder="Subject" style="width:100%" />
        <textarea id="cmp-body" class="edit" style="width:100%;min-height:160px" placeholder="Write your message — or describe it below and hit ✨ AI help"></textarea>
        <input id="cmp-instruction" class="subj" placeholder="✨ Tell Big Dog what to say, then click AI help…" style="width:100%" />
        <div class="actions" style="margin-top:8px;flex-wrap:wrap">
          <button class="btn" onclick="composeAI()">✨ AI help</button>
          <button class="btn primary" onclick="composeSend(false)">Queue as draft</button>
          <button class="btn good" onclick="composeSend(true)">Send now</button>
          <button class="btn small ghost" onclick="toggleMeeting()">📅 Meeting invite</button>
          <span id="cmp-status" class="muted small"></span>
        </div>
        <div id="cmp-meeting" style="display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
          <div class="muted small" style="margin-bottom:6px">Big Dog will add it to your calendar and draft the invite email.</div>
          <input id="cmp-mtitle" class="subj" placeholder="Meeting title (e.g. Intro call)" style="width:100%" />
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="cmp-mwhen" class="subj" type="datetime-local" style="flex:1" />
            <input id="cmp-mmins" class="subj" type="number" value="30" style="width:110px" title="minutes" />
          </div>
          <button class="btn small primary" onclick="sendMeetingInvite()">Create invite</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
