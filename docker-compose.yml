# One-command deploy for Big Dog at bigdog.builda.company with automatic HTTPS.
#   docker compose up -d --build
#
# - `bigdog`  runs the app (port 4137, internal only).
# - `caddy`   terminates TLS on 80/443 and reverse-proxies to bigdog.
# - `kokoro`  open-source TTS (Kokoro, OpenAI-compatible) so Big Dog's calls
#             have a real voice out of the box. CPU image; ~1.5GB, downloads a
#             model on first start. To skip it, comment out the service + the
#             VOICE_* env on bigdog (calls fall back to Twilio's built-in TTS).
#
# Persists across restarts: ./data (mail cache, deals, calendar SQLite),
# ./config (your accounts.json), and Caddy's certificates.
services:
  bigdog:
    build: .
    restart: unless-stopped
    depends_on:
      - kokoro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4137
      # Voice out of the box via the bundled Kokoro service. Override anytime in
      # ⚙ Settings (e.g. point at a Chatterbox server to use your cloned voice).
      - VOICE_PROVIDER=openai
      - VOICE_BASE_URL=http://kokoro:8880/v1
      - VOICE_MODEL=kokoro
      - VOICE_NAME=af_heart
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    expose:
      - "4137"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4137/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    expose:
      - "8880"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bigdog
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
